<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f5ee">
<title>{{PAGE_TITLE}} | BK LearnX</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="https://bk-learnx.vercel.app{{CANON}}">
{{ROBOTS}}
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/css/theme.css">
<link rel="stylesheet" href="/assets/css/notes.css">
<script src="/assets/js/core/theme.js"></script>
</head>
<body data-course="{{COURSE}}" data-subject="{{SLUG}}" data-subject-name="{{NAME}}" data-unit="{{N}}" data-units="{{TOTAL}}" data-lang="{{LANG}}" data-title="{{TITLE}}">
<main id="main" class="bk-container bk-unit">
<div id="bk-unit-top"></div>

{{SAMPLE}}
<!-- ===== YOUR NOTES END HERE ===== -->
</article>
<div id="bk-unit-bottom"></div>
<div id="bk-rating"></div>
</main>
<div id="bk-footer"></div>
<script src="/assets/vendor/supabase.js"></script>
<script src="/assets/js/core/config.js"></script>
<script src="/assets/js/core/supabase.js"></script>
<script src="/assets/js/core/auth.js"></script>
<script src="/assets/js/core/i18n.js"></script>
<script src="/assets/js/core/progress.js"></script>
<script src="/assets/js/components/rating.js"></script>

</body>
</html>
