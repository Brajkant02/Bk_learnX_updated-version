# Builds a test APK on GitHub (no Android Studio needed).
# How: GitHub -> Actions tab -> "Build Android APK" -> Run workflow -> wait ~6-10 minutes -> download the file under "Artifacts".
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "live = the app opens your website (always up to date). bundled = pages inside the app (new notes need a new APK)."
        type: choice
        options: [live, bundled]
        default: live
      site_url:
        description: "Your website address (needed for live mode)"
        type: string
        default: "https://bk-learnx.vercel.app"

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install app tools
        run: npm install

      - name: Choose how the app gets its pages
        run: npm run configure
        env:
          APP_MODE: ${{ inputs.mode }}
          SITE_URL: ${{ inputs.site_url }}

      - name: Copy the website into the app
        run: npm run build:www

      - name: Create the Android project
        run: npx cap add android

      - name: Add BK LearnX icon and splash
        run: |
          pip install pillow
          python android-branding.py

      - name: Sync website into Android
        run: npx cap sync android

      - name: Build the APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: BK-LearnX-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
