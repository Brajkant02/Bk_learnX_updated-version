<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f5ee">
<title>Contact | BK LearnX</title>
<meta name="description" content="Contact BK LearnX with questions, feedback or problems with notes.">
<link rel="canonical" href="https://bk-learnx.vercel.app/pages/contact/">

<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/css/theme.css">
<script src="/assets/js/core/theme.js"></script>
</head>
<body>
<main id="main" class="bk-container"><section class="bk-section bk-stack" style="max-width:640px">
<h1 data-i18n="ct_title"></h1><p class="bk-muted" data-i18n="ct_sub"></p>
<form id="form" class="bk-card bk-stack" novalidate>
<div class="bk-field"><label class="bk-label" for="name" data-i18n="ct_name"></label><input class="bk-input" id="name" autocomplete="name" maxlength="100"></div>
<div class="bk-field"><label class="bk-label" for="email" data-i18n="ct_email"></label><input class="bk-input" id="email" type="email" autocomplete="email" maxlength="254"></div>
<div class="bk-field"><label class="bk-label" for="message" data-i18n="ct_msg"></label><textarea class="bk-input" id="message" rows="5" maxlength="2000"></textarea></div>
<div class="bk-hp" aria-hidden="true"><label>Website<input id="website" tabindex="-1" autocomplete="off"></label></div>
<p class="bk-hint"><span data-i18n="ct_privacy"></span> <a class="bk-link" href="/pages/privacy/" data-i18n="ct_pp"></a></p>
<p id="msg" role="alert" hidden></p>
<button class="bk-btn" type="submit" data-i18n="ct_send"></button>
</form>
<p id="msg2" class="bk-ok" hidden></p>
<div id="links" class="bk-stack"></div>
</section></main>
<div id="bk-footer"></div>
<script src="/assets/vendor/supabase.js"></script>
<script src="/assets/js/core/config.js"></script>
<script src="/assets/js/core/supabase.js"></script>
<script src="/assets/js/core/auth.js"></script>
<script src="/assets/js/core/i18n.js"></script>
<script src="/assets/js/pages/contact.js" defer></script>
<script src="/assets/js/components/layout.js" defer></script>
</body>
</html>
