<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f5ee">
<title>Create account | BK LearnX</title>
<meta name="description" content="Create your BK LearnX account to track progress across your courses.">
<link rel="canonical" href="https://bk-learnx.vercel.app/pages/auth/registration/">
<meta name="robots" content="noindex">

<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/svg+xml" href="/assets/icons/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/css/theme.css">
<script src="/assets/js/core/theme.js"></script>
</head>
<body>
<main id="main" class="bk-container"><div class="bk-auth bk-card bk-stack">
<h1 data-i18n="reg_title"></h1>
<div id="alt" class="bk-stack"><button type="button" class="bk-btn bk-google" id="google"><svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg><span data-i18n="google"></span></button><div class="bk-divider" data-i18n="or"></div></div>
<form data-form="register" class="bk-stack" novalidate>
<div class="bk-field"><label class="bk-label" for="name" data-i18n="name"></label><input class="bk-input" id="name" type="text" autocomplete="name" required></div>
<div class="bk-field"><label class="bk-label" for="email" data-i18n="email"></label><input class="bk-input" id="email" type="email" autocomplete="email" required></div>
<div class="bk-field"><label class="bk-label" for="mobile" data-i18n="mobile"></label><input class="bk-input" id="mobile" type="tel" autocomplete="tel" inputmode="numeric" maxlength="15" required></div>
<div class="bk-field"><label class="bk-label" for="program" data-i18n="program"></label><select class="bk-input" id="program" required></select></div>
<div class="bk-field" id="sem-field" hidden><label class="bk-label" for="semester" data-i18n="semester"></label><select class="bk-input" id="semester"></select></div>
<div class="bk-field"><label class="bk-label" for="medium" data-i18n="medium"></label><select class="bk-input" id="medium"><option value="en" data-i18n="m_en"></option><option value="hi" data-i18n="m_hi"></option></select></div>
<div class="bk-field"><label class="bk-label" for="password" data-i18n="password"></label><input class="bk-input" id="password" type="password" autocomplete="new-password" required minlength=8></div>
<div class="bk-field"><label class="bk-label" for="password2" data-i18n="password2"></label><input class="bk-input" id="password2" type="password" autocomplete="new-password" required minlength=8></div>
<label class="bk-check"><input type="checkbox" id="agree"><span><span data-i18n="agree_pre"></span> <a class="bk-link" href="../../privacy/" data-i18n="privacy"></a> <span data-i18n="and"></span> <a class="bk-link" href="../../terms/" data-i18n="terms"></a></span></label>
<p id="msg" role="alert" hidden></p>
<button class="bk-btn" type="submit" data-i18n="reg_btn"></button>
</form>
<p class="bk-muted"><span data-i18n="have_account"></span> <a class="bk-link" href="../login/" data-i18n="login_btn"></a></p>
</div></main>
<div id="bk-footer"></div>
<script src="/assets/vendor/supabase.js"></script>
<script src="/assets/js/core/config.js"></script>
<script src="/assets/js/core/programs.js"></script>
<script src="/assets/js/core/supabase.js"></script>
<script src="/assets/js/core/auth.js"></script>
<script src="/assets/js/core/i18n.js"></script>
<script src="/assets/js/pages/auth.js" defer></script>
<script src="/assets/js/components/layout.js" defer></script>
</body>
</html>
