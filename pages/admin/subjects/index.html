<main id="main" class="bk-container" data-admin-nav><section class="bk-section bk-stack">
<h1 style="font-size:1.6rem">Subjects</h1>
<p class="bk-muted">A subject lives in <code>/programs/&lt;folder&gt;/</code>. Each language is its own course. “Placed in” decides which branch and semester shows it. A subject placed nowhere is an individual course.</p>
<form id="form" class="bk-card bk-stack" novalidate><b>Add a subject</b><div class="bk-opts"><div class="bk-field"><label class="bk-label" for="new-name">Name</label><input class="bk-input" id="new-name" maxlength="100" placeholder="Python"></div><div class="bk-field"><label class="bk-label" for="new-slug">Folder name</label><input class="bk-input" id="new-slug" maxlength="60" placeholder="python"></div></div><p id="msg" role="alert" hidden></p><div><button class="bk-btn" type="submit">Add subject</button></div></form>
<div class="bk-bar"><span id="count" class="bk-muted"></span></div><p id="gmsg" role="alert" hidden></p>
<div id="list" class="bk-stack"></div>
</section></main>
